server {
    listen 3000;
    server_name localhost;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    
    # Enable CORS
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,Referer,Sec-Ch-Ua,Sec-Ch-Ua-Mobile,Sec-Ch-Ua-Platform,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

server {
    listen 8000;
    server_name localhost;

    location /reports {
        # Указываем конкретный origin вместо '*' (обязательно для Allow-Credentials)
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
        # Добавляем разрешенные методы, включая PUT, DELETE
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        # Указываем явно необходимые заголовки (как в Go-примере)
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        # Разрешаем передачу куки и авторизации
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }
}